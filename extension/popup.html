<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    width: 320px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    background: #14161a;
    color: #e8eaed;
    margin: 0;
    padding: 12px;
  }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .hint { color: #9aa0ab; font-size: 11px; line-height: 1.4; margin-bottom: 10px; }
  .stream {
    background: #1c1f26;
    border: 1px solid #333844;
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 8px;
  }
  .stream .url {
    font-size: 10px;
    color: #9aa0ab;
    word-break: break-all;
    margin-bottom: 6px;
  }
  button {
    background: #ff6a1a;
    border: none;
    color: #1a1a1a;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary {
    background: #262a33;
    color: #e8eaed;
    border: 1px solid #333844;
    width: 100%;
    margin-bottom: 10px;
  }
  .btn-secondary:hover { background: #303542; }
  #downloadAll { width: 100%; margin-bottom: 10px; display: none; }
  #progress { margin-top: 10px; font-size: 12px; }
  .job-block { margin-bottom: 8px; }
  .bar {
    height: 6px;
    background: #262a33;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 4px;
  }
  .bar-fill { height: 100%; background: #ff6a1a; width: 0%; }
  .error { color: #ff6a6a; }
  #overallProgress {
    display: none;
    background: #1c1f26;
    border: 1px solid #333844;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 10px;
  }
  #overallStatus { font-size: 12px; margin-bottom: 6px; }
  #overallProgress .bar { height: 8px; margin-top: 0; }
</style>
</head>
<body>
  <h1>Film Room Downloader</h1>
  <button id="openFilmRoom" class="btn-secondary">Open Film Room Review…</button>
  <div class="hint">
    Detected video streams on this tab. Runs inside your existing logged-in
    session — nothing is scraped without you clicking Download.
  </div>
  <button id="downloadAll"></button>
  <div id="overallProgress">
    <div id="overallStatus"></div>
    <div class="bar"><div class="bar-fill" id="overallBarFill"></div></div>
  </div>
  <div id="list"></div>
  <div id="progress"></div>
  <script src="download-all.js"></script>
  <script src="popup.js"></script>
</body>
</html>
