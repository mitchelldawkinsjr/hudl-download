<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Film Room — Review</title>
  <link rel="stylesheet" href="../shared/player.css" />
  <link rel="stylesheet" href="css/a11y.css" />
  <link rel="stylesheet" href="css/review.css" />
</head>
<body class="review-app">
  <section id="loginGate" class="gate">
    <form id="loginForm" class="gate-form">
      <h1>Film Room — Review</h1>
      <label>Email <input id="loginEmail" type="email" required autocomplete="username" /></label>
      <label>Password <input id="loginPassword" type="password" required autocomplete="current-password" /></label>
      <button type="submit">Sign in</button>
      <p id="loginError" class="error" hidden></p>
    </form>
  </section>

  <main id="reviewMain" hidden>
    <header class="review-header">
      <h1 id="reviewTitle">Review</h1>
      <div class="pickers">
        <label>Game <select id="gameSelect"></select></label>
        <label>Play <select id="playSelect"></select></label>
      </div>
    </header>

    <nav class="angle-tabs" id="angleTabs" aria-label="Angle"></nav>

    <section class="player-wrap" id="playerWrap">
      <div class="video-wrap" id="videoWrap">
        <video id="video" playsinline controls></video>
        <canvas id="overlay"></canvas>
        <div class="placeholder" id="placeholder">Select an angle.</div>
      </div>
      <aside class="play-detail" id="playDetail">
        <div class="meta-row"><label>Quarter <input id="metaQuarter" type="number" min="0" max="10" /></label></div>
        <div class="meta-row"><label>Game clock <input id="metaGameClock" type="text" maxlength="20" /></label></div>
        <div class="meta-row"><label>Notes <textarea id="metaNotes" rows="4"></textarea></label></div>
        <div class="meta-actions">
          <button id="saveMetaBtn" type="button">Save notes</button>
          <span id="metaStatus" class="meta-status" role="status" aria-live="polite"></span>
        </div>
        <p class="version" id="versionTag">v—</p>
      </aside>
    </section>

    <!-- Side by side (Phase 6): shown when the Side by Side tab is active. -->
    <section class="sbs" id="sbsWrap" hidden>
      <div class="sbs-grid" id="sbsGrid"></div>
      <div class="sbs-controls">
        <button id="sbsPlay" type="button">Play</button>
        <button id="sbsPause" type="button">Pause</button>
        <button id="sbsBack5" type="button">−5s</button>
        <button id="sbsFwd5" type="button">+5s</button>
        <label>Speed <select id="sbsSpeed"><option>0.25</option><option selected>1</option><option>2</option></select></label>
        <label class="sync-offset">Sync offset (ms) <input id="sbsOffset" type="number" step="33" value="0" /></label>
        <button id="sbsSaveOffset" type="button">Save offset</button>
        <span id="sbsStatus" class="sbs-status" role="status" aria-live="polite"></span>
      </div>
      <div class="sbs-draw">
        <span>Draw on:</span>
        <label><input type="radio" name="sbsDraw" value="0" checked /> Drone</label>
        <label><input type="radio" name="sbsDraw" value="1" /> Press Box</label>
        <label><input type="radio" name="sbsDraw" value="both" /> Both</label>
      </div>
    </section>
  </main>

  <script src="js/nav.js"></script>
  <script src="../shared/player.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/multi-angle-player.js"></script>
  <script src="js/side-by-side-controller.js"></script>
  <script src="js/review-controller.js"></script>
</body>
</html>
