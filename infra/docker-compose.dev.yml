# Dev/CI-only Compose: adds a throwaway MediaMTX container so local tests have
# something to point at. Production does NOT use this — MediaMTX is external
# (ADR 0005). Run alongside the main compose:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up
services:
  mediamtx:
    image: bluenviron/mediamtx:1.9.0   # pin a tested version, not latest
    ports:
      - "8554:8554"   # RTMP
      - "1935:1935"
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC
      - "9997:9997"   # Control API
    volumes:
      - ./examples/mediamtx-reference.yml:/mediamtx.yml:ro
      - mediamtx_recordings:/recordings
    restart: unless-stopped

volumes:
  mediamtx_recordings:
